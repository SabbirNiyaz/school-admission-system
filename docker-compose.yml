services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "60244"
      POSTGRES_DB: school_admission_test
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=school_admission_test;Username=postgres;Password=60244
      HOLD_DURATION_SECONDS: "600"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend

  tests:
    profiles: ["test"]
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /src
    volumes:
      - ./backend:/src
    environment:
      TEST_CONNECTION_STRING: Host=db;Port=5432;Database=school_admission_test;Username=postgres;Password=60244
    depends_on:
      db:
        condition: service_healthy
    command: dotnet test SchoolAdmission.Tests/SchoolAdmission.Tests.csproj

volumes:
  pgdata:
